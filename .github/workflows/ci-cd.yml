name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  IMAGE_NAME: reditx-api
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
         node-version: '20.11.1'
      - name: Install dependencies
        working-directory: ./app
        run: npm install
      - name: Run tests
        working-directory: ./app
        run: npm test
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ steps.vars.outputs.sha_short }} .
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push image
        if: github.event_name == 'push'
        run: |
          docker tag $IMAGE_NAME:${{ steps.vars.outputs.sha_short }} ghcr.io/${{ steps.owner.outputs.lc }}/$IMAGE_NAME:${{ steps.vars.outputs.sha_short }}
          docker push ghcr.io/${{ steps.owner.outputs.lc }}/$IMAGE_NAME:${{ steps.vars.outputs.sha_short }} || echo "Push skipped — no registry credentials in this environment"
